<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/run/dues-contributions/">
  <title>Dues &amp; Contributions</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, system-ui, sans-serif);
      font-size: var(--hub-font-size, 14px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #111827);
      min-height: 100vh;
    }

    /* ── Header ── */
    .app-header {
      background: var(--hub-surface, #fff);
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .app-header h1 { font-size: 1.1rem; font-weight: 600; flex: none; }
    .period-selector-wrap { display: flex; align-items: center; gap: 8px; flex: 1; }
    .period-selector-wrap label { font-size: 0.8rem; color: var(--hub-text-muted, #6b7280); white-space: nowrap; }
    .period-select {
      padding: 5px 10px;
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 6px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #111827);
      font-size: 0.85rem;
      min-width: 160px;
    }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── Buttons ── */
    .btn {
      padding: 6px 14px;
      border-radius: var(--hub-radius, 6px);
      border: 1px solid var(--hub-border, #e5e7eb);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #111827);
      transition: opacity .15s;
    }
    .btn:hover { opacity: .8; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--hub-primary, #2563eb); color: var(--hub-primary-fg, #fff); border-color: transparent; }
    .btn-primary:hover { background: var(--hub-primary-hover, #1d4ed8); opacity: 1; }
    .btn-danger { color: #dc2626; border-color: #fca5a5; }
    .btn-danger:hover { background: #fef2f2; opacity: 1; }
    .btn-sm { padding: 3px 10px; font-size: 0.78rem; }

    /* ── Layout ── */
    .main { padding: 20px; max-width: 960px; margin: 0 auto; }

    /* ── Summary card ── */
    .summary-card {
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 8px);
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .summary-card.locked { border-left: 4px solid #6b7280; }
    .summary-card.open { border-left: 4px solid #16a34a; }
    .summary-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .summary-header h2 { font-size: 1rem; font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .badge-open { background: #dcfce7; color: #16a34a; }
    .badge-locked { background: #f3f4f6; color: #6b7280; }
    .badge-paid { background: #dcfce7; color: #16a34a; }
    .badge-partial { background: #fef9c3; color: #854d0e; }
    .badge-overdue { background: #fee2e2; color: #dc2626; }
    .badge-pending { background: #f3f4f6; color: #6b7280; }
    .badge-special { background: #ede9fe; color: #7c3aed; }
    .summary-stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .stat-label { font-size: 0.72rem; color: var(--hub-text-muted, #6b7280); margin-bottom: 2px; }
    .stat-value { font-size: 1.1rem; font-weight: 700; }
    .progress-bar {
      height: 6px;
      border-radius: 99px;
      background: var(--hub-border, #e5e7eb);
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--hub-primary, #2563eb);
      transition: width .3s;
    }
    .period-meta { font-size: 0.78rem; color: var(--hub-text-muted, #6b7280); margin-top: 10px; }

    /* ── Section ── */
    .section {
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 8px);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
      gap: 8px;
    }
    .section-header h3 { font-size: 0.9rem; font-weight: 600; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 8px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--hub-text-muted, #6b7280);
      text-align: left;
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
      background: var(--hub-bg, #f9fafb);
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
      font-size: 0.85rem;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--hub-bg, #f9fafb); }
    .amount-col { text-align: right; font-variant-numeric: tabular-nums; }
    .actions-col { text-align: right; white-space: nowrap; }
    .actions-col .btn + .btn { margin-left: 6px; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 36px 20px; color: var(--hub-text-muted, #6b7280); font-size: 0.85rem; }

    /* ── Allocation rules ── */
    .alloc-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
      font-size: 0.85rem;
    }
    .alloc-row:last-child { border-bottom: none; }
    .alloc-fund { flex: 1; }
    .alloc-pct { width: 60px; text-align: right; font-weight: 600; }
    .alloc-list { padding: 8px 16px; }
    .alloc-warning {
      margin: 8px 16px;
      padding: 6px 12px;
      background: #fef9c3;
      border-radius: var(--hub-radius, 6px);
      font-size: 0.78rem;
      color: #854d0e;
    }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal {
      background: var(--hub-surface, #fff);
      border-radius: var(--hub-radius, 10px);
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .modal h2 { font-size: 1rem; font-weight: 600; margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--hub-text-muted, #6b7280);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 6px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #111827);
      font-size: 0.85rem;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: 2px solid var(--hub-primary, #2563eb);
      outline-offset: 1px;
    }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--hub-border, #e5e7eb);
    }
    .form-hint { font-size: 0.75rem; color: var(--hub-text-muted, #6b7280); margin-top: 4px; }

    /* ── Alloc rule editor in modal ── */
    .alloc-editor-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .alloc-editor-row select { flex: 1; }
    .alloc-editor-row input[type="number"] { width: 70px; flex: none; }
    .alloc-total { font-size: 0.8rem; color: var(--hub-text-muted, #6b7280); margin-top: 6px; }
    .alloc-total.over { color: #dc2626; font-weight: 600; }

    /* ── Payment history inline ── */
    .payment-detail { font-size: 0.78rem; color: var(--hub-text-muted, #6b7280); line-height: 1.8; }
    .member-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* ── Reconciliation report ── */
    .recon-report {
      background: var(--hub-bg, #f9fafb);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 6px);
      padding: 14px 16px;
      font-size: 0.85rem;
      margin-top: 10px;
    }
    .recon-report h4 { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    .recon-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
    }
    .recon-row:last-child { border-bottom: none; }
    .recon-label { color: var(--hub-text-muted, #6b7280); }
    .recon-value { font-weight: 600; }

    @media (max-width: 600px) {
      .app-header { flex-direction: column; align-items: flex-start; }
      .summary-stats { grid-template-columns: repeat(2, 1fr); }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

<div class="app-header">
  <h1>&#x1F4B3; Dues &amp; Contributions</h1>
  <div class="period-selector-wrap">
    <label for="period-select">Period:</label>
    <select id="period-select" class="period-select" onchange="selectPeriod(this.value)">
      <option value="">&#x2014; no periods yet &#x2014;</option>
    </select>
  </div>
  <div class="header-actions" id="header-actions"></div>
</div>

<div class="main" id="main-content">
  <div class="empty">Loading&#x2026;</div>
</div>

<script type="module">
import { hubAlert, esc, hubConfirm, memberColor, initial } from "/hub-sdk.js";
import {
  canManageDues as _canManageDues,
  todayStr, safeParse, isDuesEligibleMember, allocTotal, memberDuesStatus,
} from "./logic.js";

const CONTEXT         = window.__CONTEXT_URL     ?? "";
const DB              = window.__DB_URL           ?? "";
const ADMIN_CONFIG    = window.__ADMIN_CONFIG_URL ?? "";
const APP_ID          = window.__APP_ID          ?? "dues-contributions";
const FINANCE_URL     = `/run/${APP_ID}/api/finance`;
const ME              = window.__CURRENT_MEMBER  ?? null;
const IS_ADMIN        = !!ME?.isAdmin;
const DEMO            = !DB;

const RESERVE_APP_ID = "reserve-fund";

// ── State ──────────────────────────────────────────────────────────────────
let members   = [];
let fundsList = [];
let data      = { periods: [], payments: [], assessments: [] };
let selectedPeriodId = null;
let groups       = [];     // family.groups [{ id, name, memberIds }]
let boardGroupId = "";     // configured Board group (gates writes server-side)

// Board WRITE actions require membership in the configured Board group — exactly
// what the server's row policies enforce (admin status alone does not satisfy a
// row policy). Configuring the group is separate and admin-only (openBoardConfig).
function amIBoard() {
  if (DEMO) return true;
  return _canManageDues(ME, groups, boardGroupId);
}

// ── DB helper ────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  if (!res.ok) {
    let msg = `DB error ${res.status}`;
    try { msg = (await res.json()).error ?? msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

async function finance(resource, payload) {
  const res = await fetch(`${FINANCE_URL}/${resource}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error ?? `Finance error ${res.status}`);
  return body;
}

// ── Indexes (rebuilt once after load; updated incrementally on mutations) ──
let membersMap            = new Map(); // id → member
let paymentsByPeriod      = new Map(); // periodId → Payment[]
let paymentsByPeriodMember = new Map(); // periodId → Map(memberId → Payment[])

function rebuildIndexes() {
  membersMap = new Map(members.map(m => [m.id, m]));
  paymentsByPeriod = new Map();
  paymentsByPeriodMember = new Map();
  for (const p of data.payments) {
    if (!paymentsByPeriod.has(p.periodId)) paymentsByPeriod.set(p.periodId, []);
    paymentsByPeriod.get(p.periodId).push(p);
    if (!paymentsByPeriodMember.has(p.periodId)) paymentsByPeriodMember.set(p.periodId, new Map());
    const byMember = paymentsByPeriodMember.get(p.periodId);
    if (!byMember.has(p.memberId)) byMember.set(p.memberId, []);
    byMember.get(p.memberId).push(p);
  }
}

function addPaymentToIndex(payment) {
  const { periodId, memberId } = payment;
  if (!paymentsByPeriod.has(periodId)) paymentsByPeriod.set(periodId, []);
  paymentsByPeriod.get(periodId).push(payment);
  if (!paymentsByPeriodMember.has(periodId)) paymentsByPeriodMember.set(periodId, new Map());
  const byMember = paymentsByPeriodMember.get(periodId);
  if (!byMember.has(memberId)) byMember.set(memberId, []);
  byMember.get(memberId).push(payment);
}

function removePaymentFromIndex(paymentId, periodId, memberId) {
  const periodList = paymentsByPeriod.get(periodId);
  if (periodList) {
    const i = periodList.findIndex(p => p.id === paymentId);
    if (i !== -1) periodList.splice(i, 1);
  }
  const memberList = paymentsByPeriodMember.get(periodId)?.get(memberId);
  if (memberList) {
    const i = memberList.findIndex(p => p.id === paymentId);
    if (i !== -1) memberList.splice(i, 1);
  }
}

// ── Modal ──────────────────────────────────────────────────────────────────
let modalEl = null;
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }
window.closeModal = closeModal;

// ── Formatting ─────────────────────────────────────────────────────────────
function fmtDollars(cents) {
  if (cents == null || cents === "") return "—";
  const n = Number(cents);
  if (!Number.isFinite(n)) return "—";
  return (n / 100).toLocaleString("en-US", { style: "currency", currency: "USD" });
}
function toCents(value) {
  const amount = Number(value);
  return Number.isFinite(amount) ? Math.round(amount * 100) : NaN;
}
function centsInput(cents) { return (Number(cents ?? 0) / 100).toFixed(2); }
function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${m}/${d}/${y}`;
}

// ── Data loading (D1) ────────────────────────────────────────────────────────
async function loadData() {
  if (DEMO) { data = getDemoData(); return; }
  const [perRows, payRows, assRows, setRows] = await Promise.all([
    db("SELECT * FROM app_dues_contributions__periods"),
    db("SELECT * FROM app_dues_contributions__payments"),
    db("SELECT * FROM app_dues_contributions__assessments"),
    db("SELECT value FROM app_dues_contributions__settings WHERE key = 'board_group_id'"),
  ]);
  data.periods = (perRows.rows ?? []).map(r => ({
    id: r.id, label: r.label, dueDate: r.due_date ?? null, amountDueCents: r.amount_due_cents ?? 0,
    status: r.status ?? "open",
    allocationRules: safeParse(r.allocation_rules, []),
    skippedMemberIds: safeParse(r.skipped_member_ids, []),
    reconciliation: safeParse(r.reconciliation, null),
    closedAt: r.closed_at ?? null, closedById: r.closed_by_id ?? null, createdAt: r.created_at,
  }));
  data.payments = (payRows.rows ?? []).map(r => ({
    id: r.id, periodId: r.period_id, memberId: r.member_id, amountCents: r.amount_cents ?? 0,
    date: r.date, postingStatus: r.posting_status, recordedById: r.recorded_by_id, recordedAt: r.recorded_at,
  }));
  data.assessments = (assRows.rows ?? []).map(r => ({
    id: r.id, label: r.label, amountCents: r.amount_cents ?? 0, dueDate: r.due_date ?? null,
    memberIds: safeParse(r.member_ids, ["all"]), createdAt: r.created_at,
  }));
  boardGroupId = setRows.rows?.[0]?.value ?? "";
}

async function loadMembers() {
  if (!CONTEXT) { members = getDemoMembers(); return; }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members,family.groups`);
    const ctx = await res.json();
    members = ctx["family.members"] ?? [];
    groups  = ctx["family.groups"] ?? [];
  } catch { members = []; groups = []; }
}

async function loadFundsList() {
  if (!CONTEXT) { fundsList = getDemoFunds(); return; }
  try {
    const res = await fetch(`${CONTEXT}?keys=app.${RESERVE_APP_ID}.funds-list`);
    const parsed = await res.json();
    const raw = parsed[`app.${RESERVE_APP_ID}.funds-list`];
    fundsList = raw ? (raw.items ?? []) : [];
  } catch { fundsList = []; }
}

// ── Demo data ──────────────────────────────────────────────────────────────
function getDemoMembers() {
  return [
    { id: "m1", name: "Alice Johnson", role: "adult", email: "alice@example.com", isAdmin: true },
    { id: "m2", name: "Bob Smith",     role: "adult", email: "bob@example.com" },
    { id: "m3", name: "Carol Davis",   role: "adult", email: "carol@example.com" },
    { id: "m4", name: "David Lee",     role: "adult" },
    { id: "m5", name: "Ella Lee",      role: "child", email: "ella@example.com" },
  ];
}
function getDemoFunds() {
  return [
    { id: "f1", name: "Roof Replacement Reserve" },
    { id: "f2", name: "Pool Resurfacing Fund" },
  ];
}
function getDemoData() {
  const p1 = "p-demo-1";
  return {
    periods: [{
      id: p1, label: "May 2026", dueDate: "2026-05-15", amountDueCents: 20000, status: "open",
      allocationRules: [{ fundId: "f1", basisPoints: 6000 }, { fundId: "f2", basisPoints: 4000 }],
      skippedMemberIds: [],
      createdAt: "2026-05-01T00:00:00Z",
    }],
    payments: [
      { id: "pay-demo-1", memberId: "m1", periodId: p1, amountCents: 20000, date: "2026-05-03", postingStatus: "posted", recordedAt: "2026-05-03T09:00:00Z" },
      { id: "pay-demo-2", memberId: "m2", periodId: p1, amountCents: 10000, date: "2026-05-05", postingStatus: "posted", recordedAt: "2026-05-05T10:00:00Z" },
    ],
    assessments: [{
      id: "a-demo-1", label: "2026 Special Assessment", amountCents: 50000,
      dueDate: "2026-06-01", memberIds: ["all"], createdAt: "2026-04-01T00:00:00Z",
    }],
  };
}

// ── Period helpers ─────────────────────────────────────────────────────────
function getPeriodPayments(periodId) {
  return paymentsByPeriod.get(periodId) ?? [];
}

function getMemberPayments(periodId, memberId) {
  return paymentsByPeriodMember.get(periodId)?.get(memberId) ?? [];
}

function getDuesMembers() {
  return members.filter(isDuesEligibleMember);
}

function getSkippedMemberIds(period) {
  return Array.isArray(period?.skippedMemberIds) ? period.skippedMemberIds : [];
}

function isMemberSkipped(period, memberId) {
  return getSkippedMemberIds(period).includes(memberId);
}

function getBillableMembers(period) {
  const skipped = new Set(getSkippedMemberIds(period));
  return getDuesMembers().filter(m => !skipped.has(m.id));
}

function getMemberStatus(memberId, period) {
  const pmts = getMemberPayments(period.id, memberId);
  const totalPaid = pmts.reduce((s, p) => s + Number(p.amountCents), 0);
  return memberDuesStatus({
    totalPaidCents: totalPaid,
    amountDueCents: period.amountDueCents,
    dueDate: period.dueDate,
    skipped: isMemberSkipped(period, memberId),
    today: todayStr(),
  });
}

let _statsCache = { key: null, stats: null };

function getPeriodStats(period) {
  const pmts = getPeriodPayments(period.id);
  const billableMembers = getBillableMembers(period);
  const skippedKey = getSkippedMemberIds(period).join(",");
  const key = `${period.id}:${pmts.length}:${members.length}:${skippedKey}`;
  if (_statsCache.key === key) return _statsCache.stats;
  const paidCount      = billableMembers.filter(m => getMemberStatus(m.id, period).status === "paid").length;
  const totalCollected = pmts.reduce((s, p) => s + Number(p.amountCents), 0);
  const totalExpected  = billableMembers.length * Number(period.amountDueCents);
  const stats = { paidCount, totalMembers: billableMembers.length, totalCollected, totalExpected };
  _statsCache = { key, stats };
  return stats;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  populatePeriodSelect();
  renderHeaderActions();
  renderMain();
}

function populatePeriodSelect() {
  const sel = document.getElementById("period-select");
  const sorted = [...data.periods].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (!sorted.length) {
    sel.innerHTML = `<option value="">&#x2014; no periods yet &#x2014;</option>`;
    selectedPeriodId = null;
    return;
  }
  if (!selectedPeriodId || !data.periods.find(p => p.id === selectedPeriodId)) {
    selectedPeriodId = sorted[0].id;
  }
  sel.innerHTML = sorted.map(p =>
    `<option value="${esc(p.id)}"${p.id === selectedPeriodId ? " selected" : ""}>${esc(p.label)}${p.status !== "open" ? " 🔒" : ""}</option>`
  ).join("");
}

function renderHeaderActions() {
  const wrap = document.getElementById("header-actions");
  // Admin-only Board config entry (sets board_group_id via the admin endpoint).
  const configBtn = IS_ADMIN ? `<button class="btn btn-sm" onclick="openBoardConfig()">⚙︎ Board</button>` : "";
  if (!amIBoard()) { wrap.innerHTML = configBtn; return; }
  const hasRuleBtn = fundsList.length ? `<button class="btn btn-sm" onclick="openAllocRulesModal()">Allocation Rules</button>` : "";
  wrap.innerHTML = `
    <button class="btn btn-sm btn-primary" onclick="openNewPeriodModal()">+ Period</button>
    <button class="btn btn-sm" onclick="openAssessmentsModal()">Assessments</button>
    ${hasRuleBtn}
    ${configBtn}
  `;
}

// ── Board group configuration (admin-only) ──────────────────────────────────
window.openBoardConfig = function() {
  if (!IS_ADMIN) return;
  const opts = groups.map(g => `<option value="${esc(g.id)}"${g.id === boardGroupId ? " selected" : ""}>${esc(g.name)}</option>`).join("");

      <label>Board group</label>
      <select id="bc-group">

        ${opts}
      </select>
      <div class="form-hint" style="margin-top:6px">Members of this group may create periods, record payments, set allocation rules, and close periods. For allocations to post, use the same Board group in the Reserve Fund app. Manage group membership in the hub's member settings.</div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBoardConfig()">Save</button>
    </div>

window.saveBoardConfig = async function() {
  const groupId = document.getElementById("bc-group").value;
  const btn = modalEl?.querySelector(".btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const res = await fetch(ADMIN_CONFIG, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: "board_group_id", value: groupId }),
    });
    if (!res.ok) { let m = "Save failed"; try { m = (await res.json()).error ?? m; } catch {} throw new Error(m); }
    boardGroupId = groupId;
    closeModal();
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
    hubAlert(e.message ?? "Save failed");
  }
};

function renderMain() {
  const el = document.getElementById("main-content");
  const period = data.periods.find(p => p.id === selectedPeriodId);
  if (!period) {
    el.innerHTML = `<div class="empty">${amIBoard()
      ? `No billing periods yet. <button class="btn btn-sm btn-primary" style="margin-left:8px" onclick="openNewPeriodModal()">Create a Period</button>`
      : "No billing periods have been created yet."
    }</div>`;
    return;
  }

  const stats  = getPeriodStats(period);
  const pct    = stats.totalExpected > 0 ? Math.min(100, Math.round(100 * stats.totalCollected / stats.totalExpected)) : 0;
  const locked = period.status !== "open";
  const closing = period.status === "closing";

  const duesMembers = getDuesMembers();
  const visibleMembers = amIBoard()
    ? duesMembers
    : duesMembers.filter(m => m.id === ME?.id && !isMemberSkipped(period, m.id));

  const summaryActions = amIBoard() && period.status === "open"
    ? `<button class="btn btn-sm" style="margin-left:auto" onclick="openEditPeriodModal()">Edit</button>
       <button class="btn btn-sm" onclick="closePeriod()">Close Period</button>
       <button class="btn btn-sm btn-danger" onclick="deletePeriod()">Delete</button>`
    : amIBoard() && closing
      ? `<button class="btn btn-sm" style="margin-left:auto" onclick="closePeriod()">Resume Close</button>`
      : "";

  el.innerHTML = `
    <div class="summary-card ${locked ? "locked" : "open"}">
      <div class="summary-header">
        <h2>${esc(period.label)}</h2>
        <span class="badge ${locked ? "badge-locked" : "badge-open"}">${closing ? "Closing" : locked ? "Closed" : "Open"}</span>
        ${summaryActions}
      </div>
      <div class="summary-stats">
        <div class="stat"><div class="stat-label">Amount Due</div><div class="stat-value">${fmtDollars(period.amountDueCents)}</div></div>
        <div class="stat"><div class="stat-label">Collected</div><div class="stat-value" id="stat-collected">${fmtDollars(stats.totalCollected)}</div></div>
        <div class="stat"><div class="stat-label">Expected</div><div class="stat-value">${fmtDollars(stats.totalExpected)}</div></div>
        <div class="stat"><div class="stat-label">Paid Members</div><div class="stat-value" id="stat-paid-count">${stats.paidCount} / ${stats.totalMembers}</div></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:${pct}%"></div></div>
      <div class="period-meta" id="period-meta">Due ${fmtDate(period.dueDate)} &nbsp;&#xB7;&nbsp; ${pct}% collected</div>
    </div>

    ${buildMemberRoster(period, visibleMembers, locked)}
    ${amIBoard() ? buildAllocSection(period) : ""}
    ${amIBoard() ? buildAssessmentsSection() : ""}
  `;
}

function buildMemberRow(m, period, locked) {
  const { status, totalPaid } = getMemberStatus(m.id, period);
  const skipped = status === "skipped";
  const bc = { paid: "badge-paid", partial: "badge-partial", overdue: "badge-overdue", pending: "badge-pending", skipped: "badge-pending" }[status] ?? "badge-pending";
  const pmts = getMemberPayments(period.id, m.id);
  const history = pmts.map(p =>
    `<div>${fmtDate(p.date)}: ${fmtDollars(p.amountCents)}${p.postingStatus !== "posted" ? ` <span class="badge badge-pending">sync pending</span>` : ""}${amIBoard() && !locked
      ? ` <button class="btn btn-sm btn-danger" style="padding:1px 6px;font-size:0.7rem" onclick="deletePayment('${esc(p.id)}')">&#x2715;</button>`
      : ""}</div>`
  ).join("");
  const color = memberColor(m.id, members);
  const ini = initial(m.name);
  return `<tr id="row-${esc(m.id)}">
    <td><span class="member-avatar" style="background:${color}">${esc(ini)}</span>${esc(m.name)}</td>
    <td class="amount-col">${skipped ? "—" : fmtDollars(period.amountDueCents)}</td>
    <td class="amount-col">${fmtDollars(totalPaid)}</td>
    <td><span class="badge ${bc}">${status}</span></td>
    <td class="payment-detail">${history || "<span style='color:var(--hub-text-muted,#9ca3af)'>none</span>"}</td>
    ${amIBoard() ? `<td class="actions-col">${!locked ? `${!skipped ? `<button class="btn btn-sm btn-primary" onclick="openRecordPaymentModal('${esc(m.id)}')">Record Payment</button>` : ""}<button class="btn btn-sm" onclick="toggleMemberSkipped('${esc(m.id)}')">${skipped ? "Collect" : "Skip"}</button>` : ""}</td>` : ""}
  </tr>`;
}

function buildMemberRoster(period, visibleMembers, locked) {
  if (!visibleMembers.length) return `<div class="section"><div class="empty">No dues-eligible members have email addresses.</div></div>`;
  const rows = visibleMembers.map(m => buildMemberRow(m, period, locked)).join("");
  return `<div class="section">
    <div class="section-header"><h3>Member Payments</h3></div>
    <table>
      <thead><tr>
        <th>Member</th><th class="amount-col">Due</th><th class="amount-col">Paid</th>
        <th>Status</th><th>History</th>${amIBoard() ? "<th></th>" : ""}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function buildAllocSection(period) {
  const rules = period.allocationRules ?? [];
  const editBtn = period.status !== "locked"
    ? `<button class="btn btn-sm" onclick="openAllocRulesModal('${esc(period.id)}')">Edit</button>`
    : "";
  if (!rules.length) {
    return `<div class="section">
      <div class="section-header"><h3>Allocation Rules</h3>${editBtn}</div>
      <div class="empty">No allocation rules. Payments won't post to any reserve fund.</div>
    </div>`;
  }
  const total = allocTotal(rules);
  const rows = rules.map(r => {
    const fund = fundsList.find(f => f.id === r.fundId);
    return `<div class="alloc-row"><div class="alloc-fund">${esc(fund?.name ?? r.fundId)}</div><div class="alloc-pct">${r.basisPoints / 100}%</div></div>`;
  }).join("");
  return `<div class="section">
    <div class="section-header"><h3>Allocation Rules</h3>${editBtn}</div>
    <div class="alloc-list">${rows}</div>
    ${total !== 100 ? `<div class="alloc-warning">&#x26A0;&#xFE0F; Allocation totals ${total}% — should be 100%</div>` : ""}
  </div>`;
}

function buildAssessmentsSection() {
  const list = data.assessments;
  if (!list.length) return "";
  const rows = list.map(a => `<tr>
    <td>${esc(a.label)} <span class="badge badge-special">assessment</span></td>
    <td class="amount-col">${fmtDollars(a.amountCents)}</td>
    <td>${fmtDate(a.dueDate)}</td>
    <td>${a.memberIds?.includes("all") ? "All members" : `${a.memberIds?.length ?? 0} members`}</td>
    <td class="actions-col"><button class="btn btn-sm btn-danger" onclick="deleteAssessment('${esc(a.id)}')">Delete</button></td>
  </tr>`).join("");
  return `<div class="section">
    <div class="section-header">
      <h3>Special Assessments</h3>
      <button class="btn btn-sm btn-primary" onclick="openNewAssessmentModal()">+ Assessment</button>
    </div>
    <table>
      <thead><tr><th>Description</th><th class="amount-col">Amount</th><th>Due</th><th>Members</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── Targeted DOM patch (record/delete payment only) ────────────────────────
function patchAfterPayment(memberId, period) {
  const tr = document.getElementById(`row-${memberId}`);
  if (!tr) { render(); return; }
  const m = membersMap.get(memberId);
  if (!m) { render(); return; }
  tr.outerHTML = buildMemberRow(m, period, period.status === "locked");

  const stats = getPeriodStats(period);
  const pct = stats.totalExpected > 0 ? Math.min(100, Math.round(100 * stats.totalCollected / stats.totalExpected)) : 0;
  const elCollected = document.getElementById("stat-collected");
  const elPaidCount = document.getElementById("stat-paid-count");
  const elProgress  = document.getElementById("progress-fill");
  const elMeta      = document.getElementById("period-meta");
  if (elCollected) elCollected.textContent = fmtDollars(stats.totalCollected);
  if (elPaidCount) elPaidCount.textContent = `${stats.paidCount} / ${stats.totalMembers}`;
  if (elProgress)  elProgress.style.width = `${pct}%`;
  if (elMeta)      elMeta.innerHTML = `Due ${fmtDate(period.dueDate)} &nbsp;&#xB7;&nbsp; ${pct}% collected`;
}

// ── Period CRUD ────────────────────────────────────────────────────────────
window.selectPeriod = function(id) {
  selectedPeriodId = id || null;
  renderHeaderActions();
  renderMain();
};

window.openNewPeriodModal = function() {
  openModal(`
    <h2>New Billing Period</h2>
    <div class="form-group">
      <label>Label (e.g. "May 2026")</label>
      <input id="f-label" type="text" placeholder="Month Year">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Amount Due per Member ($)</label>
        <input id="f-amount" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input id="f-due" type="date">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewPeriod()">Create Period</button>

window.submitNewPeriod = async function() {
  const label  = document.getElementById("f-label").value.trim();
  const amountCents = toCents(document.getElementById("f-amount").value);
  const due    = document.getElementById("f-due").value;
  if (!label)               { document.getElementById("f-label").focus(); return; }
  if (!Number.isInteger(amountCents) || amountCents < 0) { document.getElementById("f-amount").focus(); return; }

  const btn = modalEl?.querySelector(".btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Creating…"; }
  try {
    const id = crypto.randomUUID();
    const result = await finance("periods", {
      action: "create", id, label, due_date: due || null, amount_due_cents: amountCents,
    });
    data.periods.push({
      id, label, dueDate: due || null, amountDueCents: amountCents,
      status: "open", allocationRules: [], skippedMemberIds: [], reconciliation: null, createdAt: result.created_at,
    });
    selectedPeriodId = id;
    closeModal();
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Create Period"; }
    hubAlert(e.message ?? "Create failed");
  }
};

window.openEditPeriodModal = function() {
  const period = data.periods.find(p => p.id === selectedPeriodId);
  if (!period) return;
  openModal(`
    <h2>Edit Period</h2>
    <div class="form-group">
      <label>Label</label>
      <input id="f-label" type="text" value="${esc(period.label)}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Amount Due per Member ($)</label>
        <input id="f-amount" type="number" min="0" step="0.01" value="${centsInput(period.amountDueCents)}">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input id="f-due" type="date" value="${period.dueDate ?? ""}">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEditPeriod()">Save</button>
    </div>
  `);
};

window.submitEditPeriod = async function() {
  const label  = document.getElementById("f-label").value.trim();
  const amountCents = toCents(document.getElementById("f-amount").value);
  const due    = document.getElementById("f-due").value;
  if (!label) { document.getElementById("f-label").focus(); return; }

  const btn = modalEl?.querySelector(".btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const period = data.periods.find(p => p.id === selectedPeriodId);
    if (!period) return;
    const newAmountCents = Number.isInteger(amountCents) ? amountCents : period.amountDueCents;
    await finance("periods", {
      action: "update", id: period.id, label,
      amount_due_cents: newAmountCents, due_date: due || null,
    });
    period.label = label;
    period.amountDueCents = newAmountCents;
    period.dueDate = due || null;
    closeModal();
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
    hubAlert(e.message ?? "Save failed");
  }
};

window.deletePeriod = async function() {
  const period = data.periods.find(p => p.id === selectedPeriodId);
  if (!period) return;
  const cnt = getPeriodPayments(period.id).length;
  const confirmed = await hubConfirm({
    message: `Delete period "${period.label}"?`,
    description: cnt > 0
      ? `This period has ${cnt} payment record(s). Reverse and delete those payments first.`
      : "This will permanently delete the period.",
    confirmLabel: "Delete Period",
    destructive: true,
  });
  if (!confirmed) return;
  if (cnt > 0) return;
  const pid = selectedPeriodId;
  try {
    await finance("periods", { action: "delete", id: pid });
    data.periods  = data.periods.filter(p => p.id !== pid);
    rebuildIndexes();
    selectedPeriodId = data.periods[0]?.id ?? null;
    render();
  } catch (e) { hubAlert(e.message ?? "Delete failed"); }
};

window.closePeriod = async function() {
  const period = data.periods.find(p => p.id === selectedPeriodId);
  if (!period) return;
  const overdueCount = getBillableMembers(period).filter(m => {
    const { status } = getMemberStatus(m.id, period);
    return status !== "paid";
  }).length;
  const confirmed = await hubConfirm({
    message: `Close period "${period.label}"?`,
    description: `${overdueCount > 0 ? `${overdueCount} member(s) have not fully paid. ` : ""}Closing locks the period against further edits. Reserve fund entries have already been posted as payments were recorded.`,
    confirmLabel: "Close Period",
  });
  if (!confirmed) return;

  try {
    const result = await finance("periods", { action: "close", id: period.id });
    period.status = "locked";
    period.closedAt = result.closed_at;
    period.reconciliation = result.reconciliation;
    render();
    openReconModal(period);
  } catch (e) { hubAlert(e.message ?? "Close failed"); }
};

window.toggleMemberSkipped = async function(memberId) {
  const period = data.periods.find(p => p.id === selectedPeriodId);
  if (!period || period.status !== "open") return;
  const skipped = new Set(getSkippedMemberIds(period));
  if (skipped.has(memberId)) skipped.delete(memberId);
  else skipped.add(memberId);
  const skippedMemberIds = [...skipped].filter(id => membersMap.has(id));
  try {
    const result = await finance("periods", {
      action: "set_skipped_members", id: period.id, member_ids: skippedMemberIds,
    });
    period.skippedMemberIds = result.skipped_member_ids ?? skippedMemberIds;
    _statsCache = { key: null, stats: null };
    render();
  } catch (e) {
    hubAlert(e.message ?? "Update failed");
  }
};

function openReconModal(period) {
  const r = period.reconciliation;
  const overdueRows = r.overdueMembers.length
    ? r.overdueMembers.map(m =>
        `<div class="recon-row"><span class="recon-label">${esc(m.name)}</span><span class="recon-value" style="color:#dc2626">${fmtDollars(m.balanceCents)} outstanding</span></div>`
      ).join("")
    : `<div class="recon-row"><span class="recon-label" style="color:#16a34a">All members paid in full</span></div>`;
  const gap = r.totalExpectedCents - r.totalCollectedCents;
  openModal(`
    <h2>Period Closed &#x2014; Reconciliation</h2>
    <div class="recon-report">
      <h4>${esc(period.label)}</h4>
      <div class="recon-row"><span class="recon-label">Total Expected</span><span class="recon-value">${fmtDollars(r.totalExpectedCents)}</span></div>
      <div class="recon-row"><span class="recon-label">Total Collected</span><span class="recon-value">${fmtDollars(r.totalCollectedCents)}</span></div>
      <div class="recon-row"><span class="recon-label">Outstanding</span><span class="recon-value" style="color:${gap > 0 ? "#dc2626" : "#16a34a"}">${fmtDollars(gap)}</span></div>
    </div>
    <div style="margin:12px 0 6px;font-size:0.82rem;font-weight:600;color:var(--hub-text-muted,#6b7280)">Outstanding Members</div>
    <div class="recon-report">${overdueRows}</div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Done</button></div>
  `);
}

// ── Payment CRUD ───────────────────────────────────────────────────────────
window.openRecordPaymentModal = function(memberId) {
  const period = data.periods.find(p => p.id === selectedPeriodId);
  if (!period) return;
  const member = membersMap.get(memberId);
  const { totalPaid } = getMemberStatus(memberId, period);
  const remaining = Math.max(0, Number(period.amountDueCents) - totalPaid);
  const noFunds = !period.allocationRules?.length;
  openModal(`
    <h2>Record Payment &#x2014; ${esc(member?.name ?? memberId)}</h2>
    <div style="margin-bottom:14px;font-size:0.82rem;color:var(--hub-text-muted,#6b7280)">
      Period: ${esc(period.label)} &nbsp;&#xB7;&nbsp; Due: ${fmtDollars(period.amountDueCents)} &nbsp;&#xB7;&nbsp; Paid so far: ${fmtDollars(totalPaid)}
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Amount ($)</label>
        <input id="f-pay-amount" type="number" min="0.01" step="0.01" value="${centsInput(remaining)}" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input id="f-pay-date" type="date" value="${todayStr()}">
      </div>
    </div>
    ${noFunds
      ? `<div class="form-hint" style="color:#854d0e;margin-bottom:10px">&#x26A0;&#xFE0F; No allocation rules configured &#x2014; payment won't post to any reserve fund.</div>`
      : `<div class="form-hint" style="margin-bottom:10px">This payment will be immediately posted to ${period.allocationRules.length} reserve fund(s) per allocation rules.</div>`}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitPayment('${esc(memberId)}')">Record Payment</button>
    </div>
  `);
  setTimeout(() => document.getElementById("f-pay-amount")?.select(), 50);
};

window.submitPayment = async function(memberId) {
  const amountCents = toCents(document.getElementById("f-pay-amount").value);
  const date   = document.getElementById("f-pay-date").value;
  if (!Number.isInteger(amountCents) || amountCents <= 0) { document.getElementById("f-pay-amount").focus(); return; }
  if (!date) { document.getElementById("f-pay-date").focus(); return; }

  const btn = modalEl?.querySelector(".btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

  const period = data.periods.find(p => p.id === selectedPeriodId);
  if (!period) return;

  try {
    const payment = {
      id: crypto.randomUUID(), memberId, periodId: selectedPeriodId,
      amountCents, date, postingStatus: "pending", recordedAt: new Date().toISOString(),
    };
    const result = await finance("payments", {
      action: "create", id: payment.id, period_id: payment.periodId,
      member_id: memberId, amount_cents: amountCents, date,
    });
    payment.postingStatus = result.posting_status;
    payment.recordedAt = result.recorded_at;
    data.payments.push(payment);
    addPaymentToIndex(payment);
    closeModal();
    patchAfterPayment(memberId, period);
    if (result.warning) hubAlert(result.warning);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Record Payment"; }
    hubAlert(e.message ?? "Record failed");
  }
};

window.deletePayment = async function(paymentId) {
  const payment = data.payments.find(p => p.id === paymentId);
  if (!payment) return;
  const { memberId, periodId } = payment;
  const member = membersMap.get(memberId);
  const period = data.periods.find(p => p.id === periodId);
  const confirmed = await hubConfirm({
    message: "Delete this payment?",
    description: `${fmtDollars(payment.amountCents)} from ${member?.name ?? "member"} on ${fmtDate(payment.date)}. Idempotent reversal entries will be posted before deletion.`,
    confirmLabel: "Delete & Reverse",
    destructive: true,
  });
  if (!confirmed) return;
  try {
    await finance("payments", { action: "delete", id: paymentId });
    data.payments = data.payments.filter(p => p.id !== paymentId);
    removePaymentFromIndex(paymentId, periodId, memberId);
    if (period && period.id === selectedPeriodId) {
      patchAfterPayment(memberId, period);
    } else {
      render();
    }
  } catch (e) { hubAlert(e.message ?? "Delete failed"); }
};

async function retryPendingPayments() {
  if (!amIBoard()) return;
  let removed = false;
  for (const payment of [...data.payments].filter(p => p.postingStatus !== "posted")) {
    try {
      if (payment.postingStatus === "deleting") {
        await finance("payments", { action: "delete", id: payment.id });
        data.payments = data.payments.filter(candidate => candidate.id !== payment.id);
        removed = true;
      } else {
        await finance("payments", { action: "retry", id: payment.id });
        payment.postingStatus = "posted";
      }
    } catch (e) {
      console.warn(`Reserve posting retry failed for payment ${payment.id}`, e);
    }
  }
  if (removed) rebuildIndexes();
}

// ── Allocation rules ───────────────────────────────────────────────────────
window.openAllocRulesModal = function(periodId) {
  const pid = periodId || selectedPeriodId;
  const period = data.periods.find(p => p.id === pid);
  if (!period) return;
  if (!fundsList.length) {
    openModal(`
      <h2>Allocation Rules</h2>
      <div class="empty" style="padding:24px 0">No reserve funds found. Create funds in the Reserve Fund Dashboard first.</div>
      <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">OK</button></div>
    `);
    return;
  }
  window._workingRules = JSON.parse(JSON.stringify(period.allocationRules ?? []));
  window._allocPeriodId = pid;
  renderAllocEditorModal();
};

function renderAllocEditorModal() {
  const rules = window._workingRules ?? [];
  const total = allocTotal(rules);
  const ruleRows = rules.map((r, i) => `
    <div class="alloc-editor-row">
      <select onchange="updateAllocRule(${i},'fundId',this.value)">
        ${fundsList.map(f => `<option value="${esc(f.id)}"${f.id === r.fundId ? " selected" : ""}>${esc(f.name)}</option>`).join("")}
      </select>
      <input type="number" min="0" max="100" step="0.01" value="${r.basisPoints / 100}" onchange="updateAllocRule(${i},'basisPoints',this.value)" placeholder="%">
      <span>%</span>
      <button class="btn btn-sm btn-danger" onclick="removeAllocRule(${i})">&#x2715;</button>
    </div>`).join("");
  const period = data.periods.find(p => p.id === window._allocPeriodId);
  openModal(`
    <h2>Allocation Rules${period ? ` &#x2014; ${esc(period.label)}` : ""}</h2>
    <p style="font-size:0.82rem;color:var(--hub-text-muted,#6b7280);margin-bottom:14px">
      Each payment is immediately split and posted to reserve funds per these rules.
    </p>
    <div id="alloc-editor">${ruleRows}</div>
    <div class="alloc-total${total !== 100 && rules.length > 0 ? " over" : ""}" id="alloc-total">Total: ${total}%</div>
    <button class="btn btn-sm" style="margin-top:10px" onclick="addAllocRule()">+ Add Fund</button>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAllocRules()">Save Rules</button>
    </div>
  `);
}

window.addAllocRule = function() {
  window._workingRules = window._workingRules ?? [];
  window._workingRules.push({ fundId: fundsList[0].id, basisPoints: 0 });
  renderAllocEditorModal();
};

window.removeAllocRule = function(idx) {
  window._workingRules.splice(idx, 1);
  renderAllocEditorModal();
};

window.updateAllocRule = function(idx, field, value) {
  if (!window._workingRules?.[idx]) return;
  window._workingRules[idx][field] = field === "basisPoints" ? Math.round(Number(value) * 100) : value;
  const total = allocTotal(window._workingRules);
  const el = document.getElementById("alloc-total");
  if (el) {
    el.textContent = `Total: ${total}%`;
    el.className = `alloc-total${total !== 100 && window._workingRules.length > 0 ? " over" : ""}`;
  }
};

window.saveAllocRules = async function() {
  const pid = window._allocPeriodId;
  const period = data.periods.find(p => p.id === pid);
  if (!period) return;
  const btn = modalEl?.querySelector(".btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const rules = (window._workingRules ?? []).filter(r => r.fundId && r.basisPoints > 0);
    if (rules.length && allocTotal(rules) !== 100) throw new Error("Allocation rules must total exactly 100%");
    const result = await finance("periods", {
      action: "set_allocations", id: period.id,
      allocation_rules: rules.map(r => ({ fund_id: r.fundId, basis_points: r.basisPoints })),
    });
    period.allocationRules = result.allocation_rules;
    window._workingRules = null;
    window._allocPeriodId = null;
    closeModal();
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Save Rules"; }
    hubAlert(e.message ?? "Save failed");
  }
};

// ── Assessments ────────────────────────────────────────────────────────────
window.openAssessmentsModal = function() {
  renderAssessmentsModal();
};

function renderAssessmentsModal() {
  const rows = data.assessments.map(a => `<tr>
    <td>${esc(a.label)}</td>
    <td class="amount-col">${fmtDollars(a.amountCents)}</td>
    <td>${fmtDate(a.dueDate)}</td>
    <td>${a.memberIds?.includes("all") ? "All" : `${a.memberIds?.length ?? 0} members`}</td>
    <td class="actions-col"><button class="btn btn-sm btn-danger" onclick="deleteAssessmentInModal('${esc(a.id)}')">Delete</button></td>
  </tr>`).join("") || `<tr><td colspan="5" class="empty" style="padding:20px">No assessments</td></tr>`;
  openModal(`
    <h2>Special Assessments</h2>
    <table style="margin-bottom:14px">
      <thead><tr><th>Description</th><th class="amount-col">Amount</th><th>Due</th><th>Members</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="btn btn-sm btn-primary" onclick="openNewAssessmentModal()">+ New Assessment</button>
    <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Done</button></div>
  `);
}

window.openNewAssessmentModal = function() {
  openModal(`
    <h2>New Special Assessment</h2>
    <div class="form-group">
      <label>Description</label>
      <input id="f-ass-label" type="text" placeholder="e.g. 2026 Special Assessment">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Amount per Member ($)</label>
        <input id="f-ass-amount" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input id="f-ass-due" type="date">
      </div>
    </div>
    <div class="form-hint" style="margin-bottom:12px">Applies to all members.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewAssessment()">Create</button>
    </div>
  `);
  document.getElementById("f-ass-label").focus();
};

window.submitNewAssessment = async function() {
  const label  = document.getElementById("f-ass-label").value.trim();
  const amountCents = toCents(document.getElementById("f-ass-amount").value);
  const due    = document.getElementById("f-ass-due").value;
  if (!label)                { document.getElementById("f-ass-label").focus(); return; }
  if (!Number.isInteger(amountCents) || amountCents <= 0) { document.getElementById("f-ass-amount").focus(); return; }

  const btn = modalEl?.querySelector(".btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Creating…"; }
  try {
    const id = crypto.randomUUID();
    const createdAt = new Date().toISOString();
    await db(
      "INSERT INTO app_dues_contributions__assessments (id, label, amount_cents, due_date, member_ids, visibility, created_by, created_at) VALUES (?,?,?,?,'[\"all\"]','everyone',?,?)",
      [id, label, amountCents, due || null, "", createdAt],
    );
    data.assessments.push({ id, label, amountCents, dueDate: due || null, memberIds: ["all"], createdAt });
    closeModal();
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Create"; }
    hubAlert(e.message ?? "Create failed");
  }
};

window.deleteAssessment = async function(id) {
  const a = data.assessments.find(x => x.id === id);
  if (!a) return;
  const ok = await hubConfirm({ message: `Delete assessment "${a.label}"?`, destructive: true });
  if (!ok) return;
  try {
    await db("DELETE FROM app_dues_contributions__assessments WHERE id=?", [id]);
    data.assessments = data.assessments.filter(x => x.id !== id);
    render();
  } catch (e) { hubAlert(e.message ?? "Delete failed"); }
};

window.deleteAssessmentInModal = async function(id) {
  const a = data.assessments.find(x => x.id === id);
  if (!a) return;
  const ok = await hubConfirm({ message: `Delete assessment "${a.label}"?`, destructive: true });
  if (!ok) return;
  try {
    await db("DELETE FROM app_dues_contributions__assessments WHERE id=?", [id]);
    data.assessments = data.assessments.filter(x => x.id !== id);
    renderAssessmentsModal();
  } catch (e) { hubAlert(e.message ?? "Delete failed"); }
};

// ── Deep link ──────────────────────────────────────────────────────────────
function handleDeepLink() {
  const periodId = new URLSearchParams(window.location.search).get("periodId");
  if (!periodId) return;
  if (data.periods.find(p => p.id === periodId)) {
    selectedPeriodId = periodId;
    render();
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([loadMembers(), loadData(), loadFundsList()]);
  rebuildIndexes();
  if (data.periods.length) {
    selectedPeriodId = [...data.periods]
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0].id;
  }
  render();
  handleDeepLink();
  await retryPendingPayments();
  render();
})();
</script>
</body>
</html>
